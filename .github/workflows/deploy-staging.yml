name: Deploy Staging

on:
  workflow_dispatch:

concurrency:
  group: staging-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      CI: "true"
      STAGING_URL: ${{ vars.STAGING_URL }}
      STAGING_MONGODB_DB_NAME: ${{ vars.STAGING_MONGODB_DB_NAME }}
      STAGING_MONGODB_URI: ${{ secrets.STAGING_MONGODB_URI }}
      STAGING_CLERK_PUBLISHABLE_KEY: ${{ vars.STAGING_CLERK_PUBLISHABLE_KEY }}
      STAGING_CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
      STAGING_ADMIN_EMAILS: ${{ secrets.STAGING_ADMIN_EMAILS }}
      STAGING_CLERK_WEBHOOK_SECRET: ${{ secrets.STAGING_CLERK_WEBHOOK_SECRET }}
      STAGING_RESEND_API_KEY: ${{ secrets.STAGING_RESEND_API_KEY }}
      CLERK_STAGING_CONFIGURATION_VERIFIED: ${{ vars.CLERK_STAGING_CONFIGURATION_VERIFIED }}
      ANALYTICS_TEST_MONGODB_URI: ${{ secrets.ANALYTICS_TEST_MONGODB_URI }}
      E2E_MONGODB_URI: ${{ secrets.E2E_MONGODB_URI }}
      E2E_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
      E2E_CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      E2E_CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      E2E_BRAND_EMAIL: ${{ secrets.E2E_BRAND_EMAIL }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_CLERK_TEST_OTP: ${{ secrets.E2E_CLERK_TEST_OTP }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.STAGING_CLERK_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /onboarding
      NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /onboarding
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate isolated staging configuration
        run: npm run cf:staging:preflight

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test

      - name: Isolated integration tests
        run: npm run test:integration

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public Playwright
        run: npx playwright test tests/public --project=chromium

      - name: Authenticated E2E against isolated local database
        env:
          BASE_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.E2E_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
          MONGODB_URI: ${{ secrets.E2E_MONGODB_URI }}
          CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
          BRAND_EMAIL: ${{ secrets.E2E_BRAND_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.E2E_ADMIN_EMAIL }}
          CLERK_TEST_OTP: ${{ secrets.E2E_CLERK_TEST_OTP }}
        run: npx playwright test --project=creator-chromium --project=brand-chromium --project=admin-chromium

      - name: Next.js production build
        run: npm run build
      - name: OpenNext staging build
        run: npm run cf:staging:adapt
      - name: Wrangler staging dry run and size check
        shell: bash
        run: |
          npm run cf:staging:dry-run 2>&1 | tee "$RUNNER_TEMP/wrangler-dry-run.txt"
          node - "$RUNNER_TEMP/wrangler-dry-run.txt" <<'NODE'
          const fs = require("node:fs");
          const text = fs.readFileSync(process.argv[2], "utf8");
          const match = text.match(/gzip:\s*([\d.]+)\s*KiB/i);
          if (!match) throw new Error("Unable to read compressed Worker size.");
          const kib = Number(match[1]);
          if (!Number.isFinite(kib) || kib > 3072) {
            throw new Error(`Compressed Worker size ${kib} KiB exceeds the 3 MiB limit.`);
          }
          console.log(`Compressed Worker size gate passed: ${kib.toFixed(2)} KiB.`);
          NODE

      - name: Prepare ephemeral Wrangler secret file
        run: node scripts/write-staging-secrets.mjs "$RUNNER_TEMP/branzzo-staging-secrets.json"

      - name: Confirm Cloudflare account
        run: npx wrangler whoami

      - name: Deploy branzzo-staging to workers.dev
        shell: bash
        run: |
          npx wrangler deploy \
            --config wrangler.staging.jsonc \
            --strict \
            --secrets-file "$RUNNER_TEMP/branzzo-staging-secrets.json" \
            --var "NEXT_PUBLIC_APP_URL:$STAGING_URL" \
            --var "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:$STAGING_CLERK_PUBLISHABLE_KEY" \
            --var "NEXT_PUBLIC_CLERK_SIGN_IN_URL:/sign-in" \
            --var "NEXT_PUBLIC_CLERK_SIGN_UP_URL:/sign-up" \
            --var "NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:/onboarding" \
            --var "NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:/onboarding" \
            --tag "staging-${GITHUB_SHA}" \
            --message "Manual staging deployment ${GITHUB_SHA}"

      - name: Remove ephemeral secret file
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/branzzo-staging-secrets.json"

      - name: Public workers.dev smoke test
        shell: bash
        run: |
          base="${STAGING_URL%/}"
          for path in / /api/health /favicon.ico /creators /sign-in /sign-up; do
            curl --fail --silent --show-error --location --max-time 30 "$base$path" > /dev/null
          done
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$base/__branzzo-not-found-smoke")"
          test "$status" = "404"

      - name: Authenticated workers.dev smoke and role checks
        env:
          BASE_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_APP_URL: ${{ vars.STAGING_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.STAGING_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.STAGING_CLERK_SECRET_KEY }}
          CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
          BRAND_EMAIL: ${{ secrets.E2E_BRAND_EMAIL }}
          ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.STAGING_ADMIN_EMAILS }}
          CLERK_TEST_OTP: ${{ secrets.E2E_CLERK_TEST_OTP }}
        run: npx playwright test --project=creator-chromium --project=brand-chromium --project=admin-chromium

      - name: Capture safe deployment metadata
        run: |
          npx wrangler deployments list --config wrangler.staging.jsonc
          npx wrangler versions list --config wrangler.staging.jsonc

      - name: Upload safe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: staging-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
