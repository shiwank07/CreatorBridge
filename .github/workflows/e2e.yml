name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/public --project=chromium
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  authenticated:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: e2e
    env:
      BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      MONGODB_URI: ${{ secrets.E2E_MONGODB_URI }}
      CREATOR_EMAIL: ${{ secrets.E2E_CREATOR_EMAIL }}
      BRAND_EMAIL: ${{ secrets.E2E_BRAND_EMAIL }}
      ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      CLERK_TEST_OTP: ${{ secrets.E2E_CLERK_TEST_OTP }}
      ADMIN_EMAILS: ${{ secrets.E2E_ADMIN_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Require isolated authenticated E2E environment
        shell: bash
        run: |
          for name in MONGODB_URI CLERK_SECRET_KEY NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY CREATOR_EMAIL BRAND_EMAIL ADMIN_EMAIL CLERK_TEST_OTP; do
            if [ -z "${!name}" ]; then
              echo "Missing required E2E environment value: $name"
              exit 1
            fi
          done
          database_name="$(node -e "const u=new URL(process.env.MONGODB_URI);process.stdout.write(u.pathname.replace(/^\\/+/,''))")"
          if ! printf '%s' "$database_name" | grep -Eiq '(test|testing|ci|e2e|integration)'; then
            echo "E2E_MONGODB_URI must select an explicitly isolated test database."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - name: Authenticated role suites
        run: npx playwright test --project=creator-chromium --project=brand-chromium --project=admin-chromium
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-authenticated-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
