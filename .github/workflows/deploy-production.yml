name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      ANALYTICS_TEST_MONGODB_URI: ${{ secrets.ANALYTICS_TEST_MONGODB_URI }}
      NEXT_PUBLIC_APP_URL: ${{ vars.PRODUCTION_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - name: Integration tests
        if: env.ANALYTICS_TEST_MONGODB_URI != ''
        run: npm run test:integration
      - name: Require isolated integration database
        if: env.ANALYTICS_TEST_MONGODB_URI == ''
        run: |
          echo "Production validation requires ANALYTICS_TEST_MONGODB_URI."
          exit 1
      - run: npm run build
      - run: npx opennextjs-cloudflare build --skipNextBuild
      - name: Verify deployment credentials and output
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$NEXT_PUBLIC_APP_URL"
          test -f .open-next/worker.js
          test -d .open-next/assets
      - name: Deploy Worker
        run: npm run deploy
      - name: Production smoke test
        shell: bash
        run: |
          base="${NEXT_PUBLIC_APP_URL%/}"
          for path in / /api/health /favicon.ico /sign-in /sign-up; do
            healthy=false
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --location --max-time 20 "$base$path" > /dev/null; then
                healthy=true
                break
              fi
              sleep 10
            done
            if [ "$healthy" != true ]; then
              echo "Smoke test failed for path: $path"
              exit 1
            fi
          done
      - name: Upload safe failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
            .open-next/worker.js
          if-no-files-found: ignore
          retention-days: 7
